# ==============================================================================
# RENDER INFRASTRUCTURE AS CODE (IaC) BLUEPRINT
# ==============================================================================
services:
  - type: web
    name: exoticmorph-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore # hoặc oregon / frankfurt
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai # hoặc 'gemini' / 'mock'
      - key: OPENAI_API_KEY
        sync: false # Nhập thủ công trên Render Dashboard để bảo mật
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: DEBUG
        value: "false"
